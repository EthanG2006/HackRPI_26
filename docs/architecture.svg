<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
 <title id="title">Rx Radar architecture</title>
 <desc id="desc">Public weather, drug and hospital data feed an offline preprocessing pipeline. The React map and browser workers share scenario results with an optional FastAPI server. A pharmacist reviews recommendations and records decisions.</desc>
