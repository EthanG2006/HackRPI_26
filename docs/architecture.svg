   <text x="53" y="107">Weather archives</text><text x="53" y="226">Drug &amp; plant evidence</text>
   <text x="53" y="345">Hospital geography</text><text x="350" y="107">Precompute &amp; cache</text>
   <text x="650" y="107">React workspace</text><text x="650" y="288">Optional FastAPI</text>
   <text x="914" y="107">Pharmacist review</text>
  </g>
  <g fill="#abc5d1" font-size="13">
   <text x="53" y="135">NHC · WPC · SPC · USGS</text><text x="53" y="155">IEM radar · satellite imagery</text>
   <text x="53" y="254">FDA shortage postings &amp; labels</text><text x="53" y="274">Manufacturer announcements</text>
